name: eddie-scanner
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eddie-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-torch-cpu-v1
      - name: install torch (cpu)
        run: pip install --quiet numpy torch --index-url https://download.pytorch.org/whl/cpu
      - name: warm model cache
        uses: actions/cache@v4
        with:
          path: model
          key: cortex-jit-v1
      - name: run scanner
        run: python worker/scanner.py
      - name: commit state
        run: |
          git config user.name "eddie-bot"
          git config user.email "eddie-bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || git commit -m "scan $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
